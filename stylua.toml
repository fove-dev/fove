syntax = "Luau"

column_width = 140
line_endings = "Unix"

indent_type = "Spaces"
indent_width = 4

quote_style = "AutoPreferDouble"
call_parentheses = "Input"

collapse_simple_statement = "ConditionalOnly"
space_after_function_names = "Never"
block_newline_gaps = "Preserve"

[sort_requires]
enabled = false